<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaneWay v8.5 — Project Timeline Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --nav:#0d1b2a;--hdr:#152232;--hdr2:#1a2d44;--hdr3:#1f3452;
  --bg0:#ffffff;--bg1:#f7f9fc;--bgh:#edf2fa;--bgs:#dce8fb;--bgp:#edf1f8;--bgp2:#e4eaf5;
  --txt:#1a2640;--txt2:#4a5e7a;--txt3:#8fa8c4;
  --bdr:#d4dde8;--bdr2:#b8c8d8;--today:#e53e3e;
  --fn:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --r4:4px;--r6:6px;
}
.light-theme{
  --nav:#1e3a5f;--hdr:#2c4f7c;--hdr2:#3a6498;--hdr3:#4a7ab5;
  --bg0:#ffffff;--bg1:#f8fafc;--bgh:#f0f4f8;--bgs:#e8f0fb;--bgp:#f5f7fa;--bgp2:#edf2f7;
  --txt:#0f172a;--txt2:#334155;--txt3:#64748b;
  --bdr:#e2e8f0;--bdr2:#cbd5e1;--today:#dc2626;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fn);background:var(--bg1);color:var(--txt)}
#root{height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
::-webkit-scrollbar-corner{background:var(--bg1)}
/* toolbar */
.tb{height:62px;background:var(--nav);display:flex;align-items:center;gap:7px;padding:0 18px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06);user-select:none;overflow:hidden}
.stats-bar{background:var(--nav);border-bottom:1px solid rgba(255,255,255,.06);padding:0 20px;display:flex;align-items:center;gap:24px;height:32px;flex-shrink:0;overflow:hidden}
.stat-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt3);white-space:nowrap}
.stat-val{font-weight:700;color:var(--txt2);font-size:12px}
.tab-bar{height:36px;background:var(--nav);border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:flex-end;padding:0 12px;gap:2px;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
.tab-bar::-webkit-scrollbar{height:3px}.tab-bar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.tab{height:30px;padding:0 14px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;font-weight:600;user-select:none;white-space:nowrap;border:1px solid transparent;border-bottom:none;transition:background .1s,color .1s;flex-shrink:0}
.tab.active{background:var(--bg1);color:var(--txt);border-color:rgba(255,255,255,.1)}
.tab:not(.active){background:rgba(255,255,255,.04);color:var(--txt3)}
.tab:not(.active):hover{background:rgba(255,255,255,.08);color:var(--txt2)}
.tab-rename{background:transparent;border:none;outline:none;font:inherit;color:var(--txt);width:100px;font-size:12px;font-weight:600}
.tab-close{width:16px;height:16px;border-radius:3px;border:none;background:transparent;color:var(--txt3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;flex-shrink:0}
.tab-close:hover{background:rgba(239,68,68,.2);color:#f87171}
.tab-add{height:26px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--txt3);cursor:pointer;font-size:16px;display:flex;align-items:center;margin-left:4px;margin-bottom:2px;flex-shrink:0}
.tab-add:hover{background:rgba(255,255,255,.08);color:var(--txt2)}
.tb-logo{color:#fff;font-size:18px;font-weight:700;letter-spacing:-.02em;margin-right:6px;white-space:nowrap}
.tb-logo span{color:#60a5fa}
.tb-sep{width:1px;height:30px;background:rgba(255,255,255,.14);margin:0 4px;flex-shrink:0}
.tb-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#cbd5e1;padding:7px 14px;font-size:13px;font-family:var(--fn);border-radius:var(--r4);cursor:pointer;white-space:nowrap;transition:background .12s;flex-shrink:0}
.tb-btn:hover{background:rgba(255,255,255,.18);color:#fff}
.tb-lbl{color:#94a3b8;font-size:12px;white-space:nowrap;flex-shrink:0}
.tb-in{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e2e8f0;padding:6px 10px;border-radius:var(--r4);font-size:13px;font-family:var(--fn);outline:none}
.tb-in:focus{border-color:#3b82f6}
input[type=range].tb-range{accent-color:#3b82f6;cursor:pointer;border:none;background:none;padding:0;width:80px;flex-shrink:0}
.zp{display:flex;border-radius:var(--r4);overflow:hidden;border:1px solid rgba(255,255,255,.12);flex-shrink:0}
.zp-btn{background:rgba(255,255,255,.07);border:none;color:#94a3b8;padding:7px 13px;font-size:13px;font-family:var(--fn);cursor:pointer}
.zp-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.zp-btn.on{background:#2563eb;color:#fff}
.tb-sp{flex:1;min-width:2px}
/* grid */
.gw{flex:1;overflow:auto;position:relative;min-height:0}
.app-footer{flex-shrink:0;height:32px;background:var(--nav);border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;padding:0 18px;gap:20px;font-size:11px;color:var(--txt3);user-select:none}
.app-footer a{color:var(--txt3);text-decoration:none;transition:color .12s}
.app-footer a:hover{color:#a5b4fc}
.footer-sep{color:rgba(255,255,255,.15)}
.ghdr{position:sticky;top:0;z-index:30;display:flex;flex-shrink:0}
.ghl{position:sticky;left:0;z-index:31;background:var(--hdr);display:flex;align-items:stretch;border-right:2px solid rgba(255,255,255,.12);flex-shrink:0}
.ghr{background:var(--hdr);flex:1;overflow:hidden;position:relative;min-width:0}
.ghc{display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b;border-right:1px solid rgba(255,255,255,.07);overflow:hidden;white-space:nowrap;flex-shrink:0;position:relative}
.ghc .crh{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:2}
.ghc .crh:hover::after{content:'';position:absolute;left:2px;top:20%;height:60%;width:2px;background:#3b82f6;border-radius:1px}
.tband{display:flex;position:relative}
/* band row-height resize handle — sits inside the band at its bottom edge */
.band-rh{position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize;z-index:30;background:transparent}
.band-rh:hover{background:rgba(59,130,246,.2)}
.band-rh::after{content:'';position:absolute;left:10%;right:10%;bottom:1px;height:2px;background:rgba(59,130,246,.5);border-radius:1px;opacity:0;transition:opacity .15s}
.band-rh:hover::after{opacity:1}
.tbyr .tc{height:20px;font-size:11px;font-weight:700;color:#cbd5e1;background:var(--hdr);border-right:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.08);justify-content:flex-start;padding-left:8px}
.tbmo .tc{height:26px;font-size:13px;font-weight:600;color:#e2e8f0;background:var(--hdr2);border-right:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.tbmo .tc.tm{background:rgba(37,99,235,.3);color:#93c5fd;font-weight:800}
.tbwk .tc{height:17px;font-size:10px;font-weight:600;color:#94a3b8;background:var(--hdr3);border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.06)}
.tbdy .tc{height:16px;font-size:9px;font-weight:500;color:#64748b;background:#172030;border-right:1px solid rgba(255,255,255,.05)}
.tbdy .tc.wknd{background:#1e1428;color:#a78bfa}
.tbdy .tc.today-d{background:rgba(239,68,68,.25);color:#fca5a5;font-weight:700}
.tc{display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;white-space:nowrap;position:relative}
.tc .mrh{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize;z-index:3}
.tc .mrh:hover::after{content:'';position:absolute;left:3px;top:15%;height:70%;width:2px;background:#3b82f6;border-radius:1px}
/* rows */
.gr{display:flex;border-bottom:1px solid var(--bdr);position:relative;cursor:pointer;transition:height .3s cubic-bezier(.34,1.56,.64,1),background .07s;overflow:visible}
.gr:hover{background:var(--bgh)}
.gr.sel{background:var(--bgs)}
.gr.rp{background:var(--bgp)}
.gr.rp:hover{background:var(--bgp2)}
.gr.rp.sel{background:#d8e4f5}
.gr.drag-over-top::before{content:'';position:absolute;top:-1px;left:32px;right:0;height:2px;background:#3b82f6;z-index:30;pointer-events:none}
.gr.drag-over-bot::after{content:'';position:absolute;bottom:-1px;left:32px;right:0;height:2px;background:#3b82f6;z-index:30;pointer-events:none}
.gr.dragging{opacity:.4}
.grl{position:sticky;left:0;z-index:10;display:flex;flex-shrink:0;border-right:2px solid var(--bdr2);background:inherit}
.gc{position:relative;flex-shrink:0;overflow:hidden}
.lc{display:flex;align-items:center;padding:0 6px;font-size:12px;color:var(--txt);border-right:1px solid var(--bdr);overflow:hidden;white-space:nowrap;flex-shrink:0}
.lc.num{color:var(--txt3);font-size:10px;justify-content:center;padding:0}
.tog{background:none;border:none;width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:9px;border-radius:3px;cursor:pointer;padding:0;line-height:1;transition:background .1s}
.tog:hover{background:var(--bdr);color:var(--txt)}
.drag-handle{display:flex;align-items:center;justify-content:center;width:14px;flex-shrink:0;cursor:grab;color:var(--txt3);font-size:11px;opacity:0;transition:opacity .1s;padding:0 2px}
.gr:hover .drag-handle{opacity:.7}
.drag-handle:hover{opacity:1!important;color:var(--txt2)}
.badge{display:inline-flex;align-items:center;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.ms-badge{font-size:9px;font-weight:700;background:#fef3c7;color:#92400e;border:1px solid #fbbf24;border-radius:9px;padding:1px 5px;flex-shrink:0;margin-left:3px}
/* gantt bars */
.gbar{position:absolute;border-radius:5px;display:flex;align-items:center;overflow:visible;cursor:grab;user-select:none;transition:filter .1s,box-shadow .1s}
.gbar-inner{position:absolute;inset:0;border-radius:5px;overflow:hidden;pointer-events:none}
.seg-tip{position:fixed;z-index:9999;pointer-events:none;background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;min-width:170px;max-width:260px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fadein .12s ease;font-size:12px;line-height:1.6;color:#e2e8f0}
.seg-tip-label{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:6px}
.seg-tip-row{display:flex;justify-content:space-between;gap:12px;color:#64748b;font-size:11px}
.seg-tip-row span:last-child{color:#cbd5e1;font-weight:600;text-align:right}
.seg-tip-pct{margin-top:8px}
.seg-tip-pct-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:3px}
.seg-tip-pct-fill{height:100%;border-radius:2px;background:#3b82f6}
.gbr-t,.gbr-b{position:absolute;left:0;right:0;height:8px;cursor:ns-resize;z-index:5;display:flex;align-items:center;justify-content:center}
.gbr-t{top:0}.gbr-b{bottom:0}
.gbr-t::after,.gbr-b::after{content:'';display:block;width:32px;height:3px;background:rgba(255,255,255,.8);border-radius:2px;opacity:0;transition:opacity .15s}
.gbar:hover .gbr-t::after,.gbar:hover .gbr-b::after{opacity:1}
.gbar.sel .gbr-t::after,.gbar.sel .gbr-b::after{opacity:.7}
.gbar:hover{filter:brightness(1.12);box-shadow:0 3px 14px rgba(0,0,0,.32)}
.gbar:hover .lane-ctrl{opacity:1!important}
.gbar.sel .lane-ctrl{opacity:.7!important}
.gbar.sel{box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px #2563eb}
.gpct{position:absolute;left:0;top:0;height:100%;background:rgba(255,255,255,.22);pointer-events:none;border-radius:5px}
.gtxt{position:absolute;z-index:1;left:0;right:0;top:0;bottom:0;padding:4px 10px;pointer-events:none;display:flex;overflow:hidden}
.gtxt span{font-size:inherit;font-weight:600;color:inherit;text-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;max-width:100%}
.grl-h,.grr-h{position:absolute;top:0;width:10px;height:100%;z-index:3;display:flex;align-items:center;justify-content:center;transition:opacity .12s,background .12s}
.grl-h{left:0;cursor:w-resize;border-radius:5px 0 0 5px;background:rgba(0,0,0,.18);opacity:.55}
.grr-h{right:0;cursor:e-resize;border-radius:0 5px 5px 0;background:rgba(0,0,0,.18);opacity:.55}
.gbar:hover .grl-h,.gbar:hover .grr-h{opacity:1;background:rgba(0,0,0,.35)}
.gbar.sel .grl-h,.gbar.sel .grr-h{opacity:1;background:rgba(0,0,0,.4)}
.grl-h::after,.grr-h::after{content:'◁ ▷';color:rgba(255,255,255,.9);font-size:7px;letter-spacing:-1px;pointer-events:none}
.grl-h::after{content:'◁'}
.grr-h::after{content:'▷'}
/* bar height resize handles — top and bottom edges */
.gbr-t,.gbr-b{position:absolute;left:10px;right:10px;height:5px;cursor:ns-resize;z-index:4}
.gbr-t{top:-2px}.gbr-b{bottom:-2px}
.gbr-t::after,.gbr-b::after{content:'';display:block;width:30px;height:2px;background:rgba(255,255,255,.7);border-radius:1px;margin:0 auto;opacity:0;transition:opacity .15s}
.gbar:hover .gbr-t::after,.gbar:hover .gbr-b::after{opacity:1}
.sbar{position:absolute;pointer-events:none;z-index:2}
/* milestone overlay */
.msdia{position:absolute;cursor:grab;user-select:none;z-index:12;transition:filter .1s;display:flex;align-items:center;justify-content:center}
.msdia:hover{filter:brightness(1.18)}
.msdia.sel{outline:2px solid #fff;outline-offset:1px}
.mslbl{position:absolute;font-size:9px;font-weight:700;border-radius:3px;padding:2px 7px;cursor:grab;user-select:none;z-index:13;white-space:normal;word-break:break-word;line-height:1.4;min-width:60px;box-sizing:border-box;text-align:center}
.mslbl:hover{opacity:.85}
.mslbl-rh{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:ew-resize;z-index:14;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.mslbl:hover .mslbl-rh,.mslbl.sel .mslbl-rh{opacity:1}
.mslbl-rh::after{content:'⋮';color:rgba(255,255,255,.85);font-size:10px;pointer-events:none}
.msdt{display:block;font-size:8px;font-weight:400;opacity:.7;margin-top:1px}
/* grid lines */
.gl{position:absolute;top:0;width:.5px;background:var(--bdr);pointer-events:none}
.gl2{position:absolute;top:0;width:.5px;background:var(--bdr);opacity:.4;pointer-events:none}
.gl3{position:absolute;top:0;width:.5px;background:var(--bdr);opacity:.15;pointer-events:none}
/* weekend column shading in rows */
.wknd-col{position:absolute;top:0;pointer-events:none;background:rgba(139,92,246,.06)}
.today-col{position:absolute;top:0;pointer-events:none;background:rgba(239,68,68,.07)}
.tdl{position:absolute;top:0;width:2px;background:var(--today);z-index:9;pointer-events:none;box-shadow:0 0 8px rgba(229,62,62,.5)}
.tdlbl{position:absolute;font-size:8px;font-weight:800;color:var(--today);transform:translateX(-50%);pointer-events:none;z-index:26}
.gl-t{position:absolute;top:0;width:1px;background:rgba(229,62,62,.2);pointer-events:none}
/* ── hamburger menu ── */
.hbg{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:40px;height:40px;border-radius:10px;transition:background .12s;flex-shrink:0}
.hbg:hover{background:rgba(255,255,255,.1)}
.hbg span{display:block;width:20px;height:2px;background:#94a3b8;border-radius:2px;transition:background .12s}
.hbg:hover span,.hbg.open span{background:#e2e8f0}
.hbg.open{background:rgba(255,255,255,.1)}
.menu-backdrop{position:fixed;inset:0;z-index:300}
.menu-panel{position:fixed;top:68px;left:14px;width:286px;background:#1a2540;border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);z-index:301;overflow:hidden;animation:menupop .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes menupop{from{opacity:0;transform:scale(.93) translateY(-10px)}to{opacity:1;transform:none}}
.menu-section{padding:6px 0}
.menu-section+.menu-section{border-top:1px solid rgba(255,255,255,.07)}
.menu-lbl{padding:8px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#475569}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 16px;background:none;border:none;color:#cbd5e1;font-size:13px;font-family:var(--fn);cursor:pointer;text-align:left;transition:background .1s}
.mi:hover{background:rgba(255,255,255,.07);color:#f1f5f9}
.mi-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.mi-body{display:flex;flex-direction:column}
.mi-sub{font-size:11px;color:#475569;margin-top:1px;transition:color .1s}
.mi:hover .mi-sub{color:#64748b}
/* confirm modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:center;justify-content:center;animation:fadein .15s ease}
.modal-box{background:#1e293b;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:28px;width:360px;max-width:90vw;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal-box h3{margin:0 0 8px;font-size:18px;font-weight:700;color:#f1f5f9}
.modal-box p{margin:0 0 22px;font-size:13px;color:#94a3b8;line-height:1.6}
.modal-btns{display:flex;flex-direction:column;gap:8px}
.mbt{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;font-family:var(--fn);cursor:pointer;border:1px solid transparent;width:100%;text-align:center;transition:filter .1s}
.mbt:hover{filter:brightness(1.1)}
.mbt-g{background:#16a34a;color:#fff}
.mbt-r{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3)!important;color:#fca5a5}
.mbt-n{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1)!important;color:#64748b}
/* ── slide-in drawer ── */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;backdrop-filter:blur(2px);animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;margin:0;padding:0}
  .tb,.drawer,.menu-backdrop,.menu-panel,.modal-bg,.tip,.seg-tip{display:none!important}
  .app{height:auto!important;overflow:visible!important}
  .gw{overflow:visible!important;height:auto!important;max-height:none!important}
  .gw>div{width:max-content!important}
  .ghdr{position:relative!important;top:auto!important}
  .ghl{position:relative!important;left:auto!important}
  .grl{position:relative!important;left:auto!important}
  --bg0:#fff;--bg1:#f8fafc;--txt:#111827;--txt2:#374151;--txt3:#6b7280;--bdr:#e2e8f0;--bdr2:#cbd5e1;--hdr:#1e3a5f
}
@keyframes segpopin{
  0%{opacity:0;transform:translateY(-8px) scale(.97)}
  60%{transform:translateY(2px) scale(1.01)}
  100%{opacity:1;transform:none}
}
.seg-card{animation:segpopin .28s cubic-bezier(.34,1.56,.64,1)}
.drawer{position:fixed;top:0;right:0;width:520px;max-width:95vw;height:100vh;background:var(--bg0);z-index:201;
  display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.25);
  animation:slidein .22s cubic-bezier(.22,1,.36,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-hdr{display:flex;align-items:center;justify-content:space-between;padding:24px 28px 20px;border-bottom:2px solid var(--bdr);flex-shrink:0;background:var(--bgp)}
.drawer-title{font-size:20px;font-weight:700;color:var(--txt);letter-spacing:-.01em}
.drawer-close{background:none;border:none;font-size:30px;color:var(--txt3);cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px;transition:background .1s}

function dX(ds,si,mxs,months,gw){
  if(!ds)return 0;
  const p=ds.split('-').map(Number);
  const idx=(p[0]-EY)*12+(p[1]-1)-si;
  if(idx<0)return 0;
  if(idx>=months.length)return mxs[months.length];
  return mxs[idx]+((p[2]||1)-1)/dimOf(months[idx])*gw(months[idx]);
}
function xD(x,si,mxs,months,gw){
  const cx=Math.max(0,Math.min(x,mxs[months.length]));
  for(let i=0;i<months.length;i++){
    if(cx>=mxs[i]&&(cx<mxs[i+1]||i===months.length-1)){

      const[y,m]=months[i].split('-').map(Number);
      return`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

  const[y,m]=last.split('-').map(Number);

/* ── data migration helper ── */
function migrateData(d){
  (d.projects||[]).forEach(p=>(p.phases||[]).forEach(ph=>{
    if(!ph.segs)ph.segs=[];
    if(ph.segs.length===0&&ph.start&&ph.end){
      ph.segs=[{id:uid(),start:ph.start,end:ph.end,
        label:ph.label||'',pct:ph.pct||0,color:'',fontColor:'#000000',hAlign:'center',vAlign:'center'}];
    }
    const vs=(ph.segs||[]).filter(s=>s.start&&s.end);
    if(vs.length>0){
      ph.start=vs.map(s=>s.start).reduce((a,b)=>a<b?a:b);
      ph.end  =vs.map(s=>s.end).reduce((a,b)=>a>b?a:b);
    }
  }));
}

/* ── data migration helper ── */
function migrateData(d){
  (d.projects||[]).forEach(p=>(p.phases||[]).forEach(ph=>{
    if(!ph.segs)ph.segs=[];
    if(ph.segs.length===0&&ph.start&&ph.end){
      ph.segs=[{id:uid(),start:ph.start,end:ph.end,
        label:ph.label||'',pct:ph.pct||0,color:'',fontColor:'#000000',hAlign:'center',vAlign:'center'}];
    }
    const vs=(ph.segs||[]).filter(s=>s.start&&s.end);
    if(vs.length>0){
      ph.start=vs.map(s=>s.start).reduce((a,b)=>a<b?a:b);
      ph.end  =vs.map(s=>s.end).reduce((a,b)=>a>b?a:b);
    }
  }));
}

function App(){
  /* ── tab state ── */
  const[tabs,setTabsState]=useState(()=>loadTabs());
  const[activeTabId,setActiveTabIdState]=useState(()=>{
    try{return localStorage.getItem(ACTIVE_KEY)||loadTabs()[0].id;}catch(e){return'default';}
  });
  const setTabs=t=>{setTabsState(t);saveTabs(t);};
  const setActiveTabId=id=>{setActiveTabIdState(id);try{localStorage.setItem(ACTIVE_KEY,id);}catch(e){}};

  /* ── history state for undo/redo (Ctrl+Z / Ctrl+Y) ── */
  const MAX_HIST=40;
  const[hist,setHist]=useState(()=>{
    const tabs2=loadTabs();
    const aid=localStorage.getItem(ACTIVE_KEY)||tabs2[0].id;
    const d=loadTabData(aid);
    return{past:[],present:d,future:[]};
  });
  const data=hist.present;
  const setData=fn=>{
    setHist(h=>{
      const nd=typeof fn==='function'?fn(h.present):fn;
      if(nd===h.present)return h;
      return{past:[...h.past.slice(-MAX_HIST),h.present],present:nd,future:[]};
    });
  };
  const undo=()=>setHist(h=>{
    if(!h.past.length)return h;
    const prev=h.past[h.past.length-1];
    return{past:h.past.slice(0,-1),present:prev,future:[h.present,...h.future.slice(0,MAX_HIST-1)]};
  });
  const redo=()=>setHist(h=>{
    if(!h.future.length)return h;
    const next=h.future[0];
    return{past:[...h.past,h.present],present:next,future:h.future.slice(1)};
  });
  const canUndo=hist.past.length>0;
  const canRedo=hist.future.length>0;
  const[sel,   setSel]   =useState(null);
  const[adding,setAdding]=useState(null);
  const[menuOpen,setMenuOpen]=useState(false);
  const[modal,setModal]=useState(null);
  const[imgCapturing,setImgCapturing]=useState(false);
  const[showStats,setShowStats]=useState(true);
  const[theme,setTheme]=useState('dark'); /* 'dark' | 'light' */
  const[showGuide,setShowGuide]=useState(false);
  /* tooltip for segment bars */
  const[tip,setTip]=useState(null); /* {x,y,bar,ph} */
  const[addPid,setAddPid]=useState(null);
  /* drawer form state — controlled from App so drawer can be animated closed then unmounted */
  const[drawerV,setDrawerV]=useState(null); /* current form values */

  /* drag refs */
  const bdRef  =useRef(null); // bar drag
  const mdRef  =useRef(null); // milestone drag
  const crRef  =useRef(null); // name col resize
  const mrRef  =useRef(null); // month col resize
  const rdRef  =useRef(null); // row reorder drag
  const swRef  =useRef(null); // start col resize
  const fwRef  =useRef(null); // finish col resize
  const dragMoved=useRef(false); // true if pointer moved >4px since last mousedown
  const phaseBars=useRef([]);  // [{pid,phaseId,x1,x2}] — rebuilt each render for snap
  const containerRef=useRef(null);
  const importRef=useRef(null);
  const [containerW,setContainerW]=useState(window.innerWidth);
  const [importMsg,setImportMsg]=useState('');

  useEffect(()=>{if(importMsg){const t=setTimeout(()=>setImportMsg(''),4000);return()=>clearTimeout(t);}},[importMsg]);

  useEffect(()=>{
    if(!containerRef.current)return;
    const ro=new ResizeObserver(entries=>{
      for(const e of entries)setContainerW(e.contentRect.width);
    });
    ro.observe(containerRef.current);
    return()=>ro.disconnect();
  },[]);
  const[rdState,setRdState]=useState(null); // {pid,fromIdx,overIdx,half}

  useEffect(()=>{
    try{saveTabData(activeTabId,data);}catch(e){}
  },[data]);

  /* ── keyboard shortcuts ── */
  useEffect(()=>{
    const onKey=e=>{
      const ctrl=e.ctrlKey||e.metaKey;
      const tag=document.activeElement?.tagName;
      const inInput=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT';

      /* Esc — close drawer / deselect */
      if(e.key==='Escape'){closeDrawer();setMenuOpen(false);setModal(null);return;}

      /* Ctrl+Z undo, Ctrl+Y / Ctrl+Shift+Z redo */
      if(ctrl&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
      if(ctrl&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();return;}

      if(inInput)return; /* don't intercept typing */

      /* Delete / Backspace — delete selected element */
      if((e.key==='Delete'||e.key==='Backspace')&&sel){
        e.preventDefault();
        drawerDelete();
        return;
      }

      /* Ctrl+D — duplicate selected phase */
      if(ctrl&&e.key==='d'&&sel?.k==='ph'){
        e.preventDefault();
        upd(d=>{
          const proj=d.projects.find(p=>p.id===sel.pid);
          if(!proj)return;
          const ph=proj.phases.find(p=>p.id===sel.id);
          if(!ph)return;
          const clone=JSON.parse(JSON.stringify(ph));
          clone.id=uid();
          clone.label=(clone.label||'Phase')+' (copy)';
          clone.segs=clone.segs.map(s=>({...s,id:uid()}));
          proj.phases.push(clone);
        });
        return;
      }

      /* Arrow keys — nudge selected milestone date by 1 day */
      if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&sel?.k==='ms'){
        e.preventDefault();
        const delta=e.key==='ArrowRight'?1:-1;
        upd(d=>{
          const ms=d.projects.find(p=>p.id===sel.pid)?.milestones.find(m=>m.id===sel.id);
          if(!ms)return;
          const dt=new Date(ms.date+'T00:00:00');
          dt.setDate(dt.getDate()+delta);
          ms.date=dt.toISOString().slice(0,10);
        });
        return;
      }

      /* Arrow keys — nudge selected segment start/end by 1 day */
      if((e.key==='ArrowLeft'||e.key==='ArrowRight')&&sel?.k==='ph'&&sel.segId){
        e.preventDefault();
        const delta=e.key==='ArrowRight'?1:-1;
        upd(d=>{
          const ph=d.projects.find(p=>p.id===sel.pid)?.phases.find(p=>p.id===sel.id);
          if(!ph)return;
          const seg=ph.segs?.find(s=>s.id===sel.segId);
          if(!seg)return;
          const s=new Date(seg.start+'T00:00:00');
          const en=new Date(seg.end+'T00:00:00');
          s.setDate(s.getDate()+delta);
          en.setDate(en.getDate()+delta);
          seg.start=s.toISOString().slice(0,10);
          seg.end=en.toISOString().slice(0,10);
        });
        return;
      }
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[hist,sel,drawerV]);

  const upd=fn=>setData(d=>{const nd=JSON.parse(JSON.stringify(d));fn(nd);return nd;});

  /* ── tab management ── */
  const switchTab=id=>{
    /* save current tab before switching */
    saveTabData(activeTabId,data);
    const d=loadTabData(id);
    setHist({past:[],present:d,future:[]});
    setActiveTabId(id);
    closeDrawer();setSel(null);setAdding(null);setMenuOpen(false);
  };
  const addTab=()=>{
    const id='tab-'+Date.now();
    const name='New Plan';
    const newTabs=[...tabs,{id,name}];
    setTabs(newTabs);
    saveTabData(id,JSON.parse(JSON.stringify(INIT)));

  };
  const renameTab=(id,name)=>{
    setTabs(tabs.map(t=>t.id===id?{...t,name:name.trim()||'Untitled'}:t));
  };
  const deleteTab=id=>{
    if(tabs.length===1){alert('Cannot delete the last tab.');return;}
    const newTabs=tabs.filter(t=>t.id!==id);
    setTabs(newTabs);
    deleteTabData(id);
    if(activeTabId===id)switchTab(newTabs[newTabs.length-1].id);
  };

  /* ── move / copy project to another tab ── */
  const moveProjectToTab=(projId,targetTabId,keepCopy)=>{
    const proj=data.projects.find(p=>p.id===projId);
    if(!proj)return;
    const clone=JSON.parse(JSON.stringify(proj));
    /* add to target tab's data */
    const targetData=loadTabData(targetTabId);
    targetData.projects.push(clone);

    /* remove from current tab (unless copy) */
    if(!keepCopy){
      upd(d=>{d.projects=d.projects.filter(p=>p.id!==projId);});

    setProjMenu(null);
    alert((keepCopy?'Copied':'Moved')+' "'+proj.name+'" to tab "'+tabs.find(t=>t.id===targetTabId)?.name+'".');
  };
  const[renamingTabId,setRenamingTabId]=useState(null);

  /* move/copy project between tabs — portal popover */

  function exportData(){
    const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const ts=new Date().toISOString().slice(0,16).replace('T','_').replace(/:/g,'-');
    const slug=(data.planName||'laneway').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'laneway';
    a.href=url;a.download=slug+'_'+ts+'.json';a.click();
    URL.revokeObjectURL(url);
  }

  async function captureImage(opts){
    const{scope='full',scale=2,bg='white',format='png',includeLegend=true,includeHeader=true,fromYm,toYm}=opts;
    if(!containerRef.current){alert('Canvas not ready');return;}
    setImgCapturing(true);
    await new Promise(r=>setTimeout(r,80));
    const gwEl=containerRef.current;
    const origStyle={overflow:gwEl.style.overflow,width:gwEl.style.width,height:gwEl.style.height,maxHeight:gwEl.style.maxHeight,display:gwEl.style.display};
    /* ── hide/show elements ── */
    const legendEl=gwEl.parentElement?.querySelector('.ms-legend');
    const headerEl=gwEl.querySelector('.ghdr');
    if(legendEl&&!includeLegend)legendEl.style.display='none';
    if(headerEl&&!includeHeader)headerEl.style.visibility='hidden';
    /* ── compute crop region ── */
    let cropX=0,cropY=0,cropW,cropH;
    if(scope==='range'&&fromYm&&toYm){
      /* compute pixel X range from month offsets */
      const fromIdx=ymI(fromYm)-si;
      const toIdx=ymI(toYm)-si+1;
      const x1=fromIdx>=0?mxs[Math.max(0,fromIdx)]:0;
      const x2=toIdx<=mxs.length?mxs[Math.min(mxs.length-1,toIdx)]:mxs[mxs.length-1];
      cropX=LW+x1; cropW=(x2-x1)+LW;
      cropY=0; cropH=gwEl.scrollHeight;
    }else if(scope==='full'){
      cropW=gwEl.scrollWidth; cropH=gwEl.scrollHeight;
    }else{
      cropW=gwEl.clientWidth; cropH=gwEl.clientHeight;
      cropX=gwEl.scrollLeft; cropY=gwEl.scrollTop;
    }
    /* ── expand container for full/range capture ── */
    const needsExpand=scope==='full'||scope==='range';
    if(needsExpand){
      gwEl.style.overflow='visible';

  /* ── row renderer ── */

        onClick:e=>e.stopPropagation()},
        h('div',{className:'grl',style:{width:LW,height:rh,position:'sticky',left:0,zIndex:10,

          h('input',{className:'plan-name-row',
            value:data.planName||'',

          h('div',{style:{display:'flex',gap:10,alignItems:'center',paddingLeft:6}},
            h('span',{style:{fontSize:10,color:'#3b82f6',fontWeight:700}},projects.length+' project'+(projects.length===1?'':'s')),
            totalPhases>0&&h('span',{style:{fontSize:10,color:'#64748b'}},totalPhases+' phases'),
            totalMs>0&&h('span',{style:{fontSize:10,color:'#64748b'}},totalMs+' milestones'),

            window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);

    const isDragging=rdState&&k==='ph'&&row.proj.id===rdState.pid&&row.phi===rdState.fromIdx;
    const isOverTop =rdState&&k==='ph'&&row.proj.id===rdState.pid&&row.phi===rdState.overIdx&&rdState.half===0&&rdState.overIdx!==rdState.fromIdx;
    const isOverBot =rdState&&k==='ph'&&row.proj.id===rdState.pid&&row.phi===rdState.overIdx&&rdState.half===1&&rdState.overIdx!==rdState.fromIdx;

    let leftC;
    if(k==='proj'){
      const{proj,ps,pe}=row;
      const ic=!!collapsed[proj.id];
      const msCnt=proj.milestones.length;
      const otherTabs=tabs.filter(t=>t.id!==activeTabId);
      leftC=h('div',{className:'grl',style:{width:LW,height:rh}},
        h('div',{className:'lc num',style:{width:32,height:rh}},idx),
        h('div',{className:'lc',style:{width:NW,height:rh,gap:4,fontWeight:600,fontSize:12}},
          h('button',{className:'tog',onClick:e=>{e.stopPropagation();upd(d=>{ic?delete d.collapsed[proj.id]:d.collapsed[proj.id]=true;});}},ic?'▶':'▼'),

    }else if(k==='ph'){
      const{proj,ph,phi}=row;
      const c=PC[ph.type]||PC.qa;
      /* auto-calculate display dates: try segments first, fall back to phase envelope */
      const _segStarts=(ph.segs||[]).map(s=>s.start).filter(Boolean);
      const _segEnds  =(ph.segs||[]).map(s=>s.end).filter(Boolean);
      const phStart=_segStarts.length?_segStarts.reduce((a,b)=>a<b?a:b):ph.start||'';
      const phEnd  =_segEnds.length  ?_segEnds.reduce((a,b)=>a>b?a:b):ph.end||'';
      /* ── roll-up progress: weighted avg by segment duration ── */
      const segsWithPct=(ph.segs||[]).filter(s=>s.start&&s.end);
      let rollupPct=0;
      if(segsWithPct.length){

      leftC=h('div',{className:'grl',style:{width:LW,height:rh}},
        h('div',{className:'lc num',style:{width:32,height:rh}},idx),
        h('div',{className:'lc',style:{width:NW,height:rh,gap:2,paddingLeft:8}},
          h('div',{className:'drag-handle',
            title:'Drag to reorder phase',
            onMouseDown:e=>{

            }},'⋮⋮'),
          h('div',{style:{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',justifyContent:'center',gap:2}},
            h('span',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:1.2,
              color:ph.fontColor||'var(--txt)',

            rollupPct>0&&h('div',{style:{display:'flex',alignItems:'center',gap:4}},
              h('div',{style:{flex:1,height:3,borderRadius:2,background:'rgba(255,255,255,.1)',overflow:'hidden'}},
                h('div',{style:{width:rollupPct+'%',height:'100%',borderRadius:2,
                  background:rollupPct===100?'#4ade80':'#60a5fa',transition:'width .3s'}})),
              h('span',{style:{fontSize:9,color:'var(--txt3)',minWidth:24,textAlign:'right',flexShrink:0}},rollupPct+'%')))),
        h('div',{className:'lc',style:{width:68,height:rh,padding:'0 4px'}},
          h('select',{
            value:ph.type||'dev',
            title:'Change phase type',
            onClick:e=>e.stopPropagation(),
            onChange:e=>{e.stopPropagation();const phId_=ph.id;upd(d=>{const proj_=d.projects.find(p=>p.id===proj.id);const ph_=proj_?.phases.find(p=>p.id===phId_);if(ph_)ph_.type=e.target.value;});},
            style:{
              width:'100%',fontSize:10,fontWeight:700,cursor:'pointer',
              background:c.bg,color:'#1e293b',border:'none',borderRadius:6,
              padding:'2px 2px',appearance:'none',textAlign:'center',
              fontFamily:'inherit',height:22,outline:'none'}},
            Object.entries(PC).map(([k,pc])=>h('option',{key:k,value:k},pc.lbl)))),
        h('div',{className:'lc',style:{width:SW,height:rh,fontSize:11,color:'var(--txt2)'}},fmtS(phStart)),
        h('div',{className:'lc',style:{width:FW,height:rh,fontSize:11,color:'var(--txt2)'}},fmtS(phEnd)),
        showDays&&h('div',{className:'lc',style:{width:60,height:rh,fontSize:11,color:'var(--txt3)',fontFamily:'monospace',justifyContent:'center'}},phStart&&phEnd?bizDayCt(phStart,phEnd):''));
    }

    const gels=[];
    /* month dividers */
    mxs.forEach((x,i)=>{if(i>0&&i<=months.length)gels.push(h('div',{key:'gl'+i,className:'gl',style:{left:x,height:rh}}));});
    /* week dividers */
    if(showW)months.forEach(ym=>{
      const d=dimOf(ym),mw=gw(ym),x0=mxs[ymI(ym)-si];
      for(let s=8;s<=d;s+=7)gels.push(h('div',{key:'wl'+ym+s,className:'gl2',style:{left:x0+(s-1)/d*mw,height:rh}}));
    });
    /* day dividers + weekend shading — respects bizDays mode */
    if(showD)months.forEach(ym=>{
      const d=dimOf(ym),mw=gw(ym),x0=mxs[ymI(ym)-si];
      const[y,m]=ym.split('-').map(Number);
      let curX=0;
      for(let di=1;di<=d;di++){
        const dw=dow(y,m,di);
        const isWknd=dw===0||dw===6;
        /* in bizDays mode skip weekend days entirely */
        if(bizDays&&isWknd)continue;
        const colW=bizDays?mw/d*(7/5):mw/d;
        const x=x0+curX;
        const isToday=ym===TDY&&di===+TDF.split('-')[2];
        if(isToday){
          gels.push(h('div',{key:'tdc'+ym+di,className:'today-col',style:{left:x,width:colW,height:rh}}));
        }else if(!bizDays&&isWknd){
          gels.push(h('div',{key:'wc'+ym+di,className:'wknd-col',style:{left:x,width:colW,height:rh}}));
        }
        if(curX>0)gels.push(h('div',{key:'dl'+ym+di,className:'gl3',style:{left:x,height:rh}}));
        curX+=colW;
      }
    });
    if(tdVis)gels.push(h('div',{key:'tg',className:'gl-t',style:{left:tdX,height:rh}}));

    if(k==='proj'){
      const{proj,ps,pe}=row;
      if(ps&&pe){
        const x1=dX(ps,si,mxs,months,gw),x2=dX(pe,si,mxs,months,gw),w=Math.max(x2-x1,8);
        const ty=(rh-SBH)/2;
        gels.push(h('div',{key:'sb',className:'sbar',style:{left:x1,top:0,width:w,height:rh}},
          h('div',{style:{position:'absolute',left:0,top:ty,width:w,height:SBH,background:SUM,borderRadius:2}}),
          h('div',{style:{position:'absolute',left:0,top:ty+SBH,width:0,height:0,borderStyle:'solid',borderWidth:'7px 7px 0 0',borderColor:SUM+' transparent transparent transparent'}}),
          h('div',{style:{position:'absolute',right:0,top:ty+SBH,width:0,height:0,borderStyle:'solid',borderWidth:'7px 0 0 7px',borderColor:SUM+' transparent transparent transparent'}})));
        if(tdVis&&tdX>x1&&tdX<x2)
          gels.push(h('div',{key:'sbp',style:{position:'absolute',left:x1,top:ty,width:tdX-x1,height:SBH,background:'#60a5fa',opacity:.5,borderRadius:'2px 0 0 2px',pointerEvents:'none'}}));
      }
    }else if(k==='ph'){
      const{proj,ph}=row;
      const BAR_PAD=4;
      const defaultBarH=BH;
      const phBH=data.phBarH||{};
      const hasSegs=ph.segs&&ph.segs.length>1;
      /* barH: respect manual override (phBH) always; default to fill-row for multi-seg, BH for single */
      const segDefaultH=hasSegs ? rh-BAR_PAD*2 : BH;
      const barH=Math.max(8,Math.min(rh-BAR_PAD*2,phBH[ph.id]??segDefaultH));
      const top=BAR_PAD;
      const c=PC[ph.type]||PC.qa;
      const isPhSel=sel?.k==='ph'&&sel.id===ph.id&&!sel.segId;
      const _pid=proj.id,_id=ph.id;

      /* determine which bars to render: segments if defined, else the phase itself */
      const bars=ph.segs&&ph.segs.length>0
        ? ph.segs.map(s=>({...s,isSeg:true}))
        : [{...ph,isSeg:false}];

      /* lane-based layout — each segment has its own barH stored in seg.barH */
      const STACK_GAP=4;
      const maxLane=bars.reduce((m,b)=>Math.max(m,(b.lane||0)),0);
      /* height of each lane = max barH of all segments on that lane */
      const laneHeights=Array.from({length:maxLane+1},(_,li)=>{
        const onLane=bars.filter(b=>(b.lane||0)===li);
        return onLane.length?onLane.reduce((mx,b)=>Math.max(mx,Math.max(8,b.barH??BH)),8):BH;
      });
      /* y-offset of each lane */
      const laneY=laneHeights.reduce((acc,h2,i)=>{
        acc.push(i===0?top:(acc[i-1]+laneHeights[i-1]+STACK_GAP));
        return acc;
      },[]);

      bars.forEach((bar,bi)=>{
        const x1=dX(bar.start,si,mxs,months,gw);
        const x2=dX(bar.end,si,mxs,months,gw);
        const bw=Math.max(x2-x1,6);
        const barColor=bar.color||(bar.isSeg?c.bg:ph.color||c.bg);
        const lane=bar.lane||0;
        const thisBarH=Math.max(8,bar.barH??BH);
        const barTop=laneY[lane]??top;
        const fontSize=Math.min(13,Math.max(9,thisBarH*0.55));
        const segKey=bar.isSeg?bar.id:'main';
        const isBarSel=sel?.k==='ph'&&sel.id===ph.id&&(sel.segId===bar.id||(segKey==='main'&&!sel.segId));

        gels.push(h('div',{key:'bar-'+segKey,
          className:'gbar'+(isBarSel?' sel':''),
          style:{left:x1+1,width:bw-2,top:barTop,height:thisBarH},
          onMouseEnter:e=>{setTip({x:e.clientX,y:e.clientY,bar,ph,bw});},
          onMouseMove:e=>{setTip(t=>t?{...t,x:e.clientX,y:e.clientY}:null);},
          onMouseLeave:()=>setTip(null),
          onClick:e=>{e.stopPropagation();setTip(null);if(dragMoved.current)return;
            setSel({k:'ph',pid:_pid,id:_id,segId:bar.isSeg?bar.id:null});setAdding(null);},
          onMouseDown:e=>{setTip(null);
            const isL=e.target.closest('.grl-h');
            const isR=e.target.closest('.grr-h');

            if(isR){e.preventDefault();e.stopPropagation();bdRef.current={type:'E',pid:_pid,id:_id,segId,sx:e.clientX,os:bar.start,oe:bar.end,si,xs:[...mxs],mo:[...months],gw};document.body.style.cursor='e-resize';document.body.style.userSelect='none';return;}
            e.preventDefault();e.stopPropagation();

            }},h('span',{style:{fontSize:fontSize+'px',
              color:bar.fontColor||'#000000',
              fontWeight:bar.bold?700:'inherit',
              fontStyle:bar.italic?'italic':'inherit',
              textDecoration:bar.underline?'underline':'inherit',
            }},(bar.label||ph.label)+(bar.pct>0?' · '+bar.pct+'%':''))),
            /* lane up/down arrows — visible on hover, only for actual segments */
            bar.isSeg&&h('div',{style:{position:'absolute',right:18,top:0,bottom:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:1,opacity:0,transition:'opacity .15s',pointerEvents:'all'},

              h('button',{title:'Move up a lane (push overlapping segments down)',
                style:{background:'rgba(0,0,0,.4)',border:'none',color:'#fff',cursor:'pointer',borderRadius:3,fontSize:9,lineHeight:1,padding:'1px 3px',fontFamily:'inherit'},
                onClick:e=>{e.stopPropagation();
                  const curLane=bar.lane||0;
                  if(curLane===0)return;
                  const newLane=curLane-1;
                  upd(d=>{
                    const phaseSegs=d.projects.find(p=>p.id===_pid)?.phases.find(p=>p.id===_id)?.segs;
                    if(!phaseSegs)return;
                    const movingSeg=phaseSegs.find(s=>s.id===bar.id);
                    if(!movingSeg)return;
                    /* push any overlapping segs on target lane down by 1 */
                    phaseSegs.forEach(s=>{
                      if(s.id===bar.id)return;
                      if((s.lane||0)===newLane&&s.start<movingSeg.end&&s.end>movingSeg.start)
                        s.lane=curLane;
                    });
                    movingSeg.lane=newLane;
                  });}
              },'▲'),
              h('button',{title:'Move down a lane (push overlapping segments up)',
                style:{background:'rgba(0,0,0,.4)',border:'none',color:'#fff',cursor:'pointer',borderRadius:3,fontSize:9,lineHeight:1,padding:'1px 3px',fontFamily:'inherit'},
                onClick:e=>{e.stopPropagation();
                  const curLane=bar.lane||0;
                  const newLane=curLane+1;
                  upd(d=>{
                    const phaseSegs=d.projects.find(p=>p.id===_pid)?.phases.find(p=>p.id===_id)?.segs;
                    if(!phaseSegs)return;
                    const movingSeg=phaseSegs.find(s=>s.id===bar.id);
                    if(!movingSeg)return;
                    /* push any overlapping segs on target lane up by 1 */
                    phaseSegs.forEach(s=>{
                      if(s.id===bar.id)return;
                      if((s.lane||0)===newLane&&s.start<movingSeg.end&&s.end>movingSeg.start)
                        s.lane=curLane;
                    });
                    movingSeg.lane=newLane;
                  });}
              },'▼'))),
          h('div',{className:'grl-h',title:'Drag start date'}),
          h('div',{className:'grr-h',title:'Drag end date'})));
      });

      /* bar height resize handles — per segment, independent heights */
      bars.forEach((bar,bi)=>{
        const lane=bar.lane||0;
        const thisBarH=Math.max(8,bar.barH??BH);
        const barTop=laneY[lane]??top;
        const segKey=bar.isSeg?bar.id:'main';
        const phId_=ph.id;
        const segId_=bar.isSeg?bar.id:null;
        const rowId='ph_'+phId_;
        /* helper: update seg.barH or phBarH depending on whether it's a segment */
        const writeH=(d,nh)=>{
          if(segId_){
            const seg=d.projects.find(p=>p.id===_pid)?.phases.find(p=>p.id===phId_)?.segs?.find(s=>s.id===segId_);

            d.phBarH={...(d.phBarH||{}),[phId_]:nh};

          /* auto-expand row if needed */
          const needed=nh+BAR_PAD*2;
          const curRh=d.rowH?.[rowId]??RH;
          if(needed>curRh)d.rowH={...(d.rowH||{}),[rowId]:Math.ceil(needed)};
        };
        /* top handle */
        gels.push(h('div',{key:'gbrt-'+segKey,className:'gbr-t',
          style:{position:'absolute',left:dX(bar.start,si,mxs,months,gw)+2,
            width:Math.max(dX(bar.end,si,mxs,months,gw)-dX(bar.start,si,mxs,months,gw)-4,20),
            top:barTop,height:8,zIndex:5,cursor:'ns-resize'},
          onMouseDown:e=>{e.preventDefault();e.stopPropagation();
            const sh=thisBarH,sy_=e.clientY;
            const mm=ev=>upd(d=>{writeH(d,Math.max(8,sh-(ev.clientY-sy_)));});
            const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';document.body.style.userSelect='';};
            window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
            document.body.style.cursor='ns-resize';document.body.style.userSelect='none';}}));
        /* bottom handle */
        gels.push(h('div',{key:'gbrb-'+segKey,className:'gbr-b',
          style:{position:'absolute',left:dX(bar.start,si,mxs,months,gw)+2,
            width:Math.max(dX(bar.end,si,mxs,months,gw)-dX(bar.start,si,mxs,months,gw)-4,20),
            top:barTop+thisBarH-8,height:8,zIndex:5,cursor:'ns-resize'},
          onMouseDown:e=>{e.preventDefault();e.stopPropagation();
            const sh=thisBarH,sy_=e.clientY;
            const mm=ev=>upd(d=>{writeH(d,Math.max(8,sh+(ev.clientY-sy_)));});
            const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';document.body.style.userSelect='';};
            window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
            document.body.style.cursor='ns-resize';document.body.style.userSelect='none';}}));
      });
    }

    const rowCls='gr'+(k==='proj'?' rp':'')+(k==='msrow'?' ms-row':'')+(isSel?' sel':'')+(isDragging?' dragging':'')+(isOverTop?' drag-over-top':'')+(isOverBot?' drag-over-bot':'');

    /* milestone row — just a container with resize handle and label */
    if(k==='msrow'){
      const{proj,rh}=row;
      const gels2=[];
      mxs.forEach((x,i)=>{if(i>0&&i<=months.length)gels2.push(h('div',{key:'gl'+i,className:'gl',style:{left:x,height:rh}}));});
      if(showW)months.forEach(ym=>{const d=dimOf(ym),mw=gw(ym),x0=mxs[ymI(ym)-si];for(let s=8;s<=d;s+=7)gels2.push(h('div',{key:'wl'+ym+s,className:'gl2',style:{left:x0+(s-1)/d*mw,height:rh}}));});
      if(showD)months.forEach(ym=>{
        const d=dimOf(ym),mw=gw(ym),x0=mxs[ymI(ym)-si];
        const[y,m]=ym.split('-').map(Number);
        let curX=0;
        for(let di=1;di<=d;di++){
          const dw=dow(y,m,di),isWknd=dw===0||dw===6;
          if(bizDays&&isWknd)continue;
          const colW=bizDays?mw/d*(7/5):mw/d;
          const x=x0+curX;
          if(!bizDays&&isWknd)gels2.push(h('div',{key:'wc'+ym+di,className:'wknd-col',style:{left:x,width:colW,height:rh}}));
          if(curX>0)gels2.push(h('div',{key:'dl'+ym+di,className:'gl3',style:{left:x,height:rh}}));
          curX+=colW;
        }
      });
      if(tdVis)gels2.push(h('div',{key:'tg',className:'gl-t',style:{left:tdX,height:rh}}));
      return h('div',{key:'r'+idx,className:rowCls,style:{height:rh,position:'relative'}},
        h('div',{className:'grl',style:{width:LW,height:rh,position:'sticky',left:0,zIndex:10,background:'var(--bg1)',borderRight:'2px solid var(--bdr2)',display:'flex',alignItems:'center',padding:'0 10px',gap:6}},
          h('span',{style:{fontSize:9,fontWeight:700,color:'var(--txt3)',textTransform:'uppercase',letterSpacing:'.06em',userSelect:'none'}},'Milestones'),
          h('span',{style:{fontSize:9,color:'var(--txt3)'}},'↕ drag bottom edge to expand')),
        h('div',{className:'gc',style:{height:rh,width:GW}},gels2),
        /* row resize handle at bottom */
        h('div',{style:{position:'absolute',bottom:0,left:0,right:0,height:6,cursor:'row-resize',zIndex:20},
          title:'Drag to expand milestone row',
          onMouseDown:e=>{
            e.preventDefault();
            const pid_=proj.id,sh_=rh;
            const sy_=e.clientY;
            const mm=ev=>{
              const nh=Math.max(MS_ROW_H,sh_+(ev.clientY-sy_));
              setData(d=>({...d,msRowH:{...(d.msRowH||{}),[pid_]:nh}}));
            };
            const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';document.body.style.userSelect='';};
            window.addEventListener('mousemove',mm);
            window.addEventListener('mouseup',mu);
            document.body.style.cursor='row-resize';document.body.style.userSelect='none';
          }},
          h('div',{style:{position:'absolute',left:8,right:8,bottom:2,height:2,background:'var(--bdr2)',borderRadius:1}})));
    }
    /* shared row-resize handle for proj and ph rows */
    const rowKey=k==='proj'?'proj_'+row.proj.id:'ph_'+row.ph?.id;
    const onRowResize=e=>{
      e.preventDefault();e.stopPropagation();
      const sh=rh,sy=e.clientY,rk=rowKey;
      const mm=ev=>{
        dragMoved.current=true;
        const nh=Math.max(RH,sh+(ev.clientY-sy));
        setData(d=>({...d,rowH:{...(d.rowH||{}),[rk]:nh}}));
      };
      const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';document.body.style.userSelect='';setTimeout(()=>{dragMoved.current=false;},0);};
      window.addEventListener('mousemove',mm);
      window.addEventListener('mouseup',mu);
      document.body.style.cursor='row-resize';document.body.style.userSelect='none';
    };

    return h('div',{key:'r'+idx,className:rowCls,style:{height:rh,position:'relative'},
      onClick:()=>{
        if(dragMoved.current)return;
        if(k==='proj')setSel({k:'proj',pid:row.proj.id});
        else if(k==='ph')setSel({k:'ph',pid:row.proj.id,id:row.ph.id});
        setAdding(null);
      }},
      leftC,
      h('div',{className:'gc',style:{height:rh,width:GW}},gels),
      /* row resize handle */
      h('div',{
        style:{position:'absolute',bottom:0,left:0,right:0,height:5,cursor:'row-resize',zIndex:18,userSelect:'none'},
        title:'Drag to resize row height',
        onMouseDown:onRowResize,
        onClick:e=>e.stopPropagation()},
        h('div',{style:{position:'absolute',left:LW+8,right:8,bottom:0,height:2,background:'transparent',borderRadius:1,transition:'background .15s'},
          className:'row-rh-indicator'})));
  }

  /* ── milestone overlay ── */
  function renderMilestones(){
    /* reset phase bar registry — populate per-segment so milestones snap to segments */
    phaseBars.current=[];
    flatRows.forEach(row=>{
      if(row.k==='ph'){
        const{proj,ph}=row;
        (ph.segs&&ph.segs.length>0?ph.segs:[ph]).forEach(seg=>{
          const x1=dX(seg.start,si,mxs,months,gw);
          const x2=dX(seg.end,si,mxs,months,gw);
          phaseBars.current.push({
            pid:proj.id,
            phaseId:ph.id,
            segId:seg.id||null,
            x1,x2
          });
        });
      }
    });
    const els=[];
    /* Build a map: projId -> {msRowY, msRowH, projX1, projX2} */
    const projInfo={};
    let rowY=0;
    flatRows.forEach(row=>{
      if(row.k==='proj'){
        const proj=row.proj;
        const ss=proj.phases.map(p=>p.start).filter(Boolean);
        const ee=proj.phases.map(p=>p.end).filter(Boolean);
        const ps=ss.length?ss.reduce((a,b)=>a<b?a:b):'';
        const pe=ee.length?ee.reduce((a,b)=>a>b?a:b):'';
        projInfo[proj.id]={
          projX1:0,   /* allow diamond anywhere in the grid, not just within phase span */
          projX2:GW,
          projRowY:rowY,
          msRowY:null,msRowH:MS_ROW_H,projGroupH:RH,
        };
      }
      if(row.k==='msrow'){
        projInfo[row.proj.id].msRowY=rowY;
        projInfo[row.proj.id].msRowH=row.rh;
        /* msrow is the last row in the group — set projGroupH to include it */
        projInfo[row.proj.id].projGroupH=(rowY+row.rh)-projInfo[row.proj.id].projRowY;
      }
      /* accumulate phase rows into projGroupH only if no msrow yet */
      if(row.k==='ph'&&projInfo[row.proj.id]){
        projInfo[row.proj.id].projGroupH=(rowY+row.rh)-projInfo[row.proj.id].projRowY;
      }
      rowY+=row.rh;
    });

    projects.forEach(proj=>{
      const info=projInfo[proj.id];
      if(!info)return; /* project not in view */

      proj.milestones.forEach(ms=>{
        const mi=ymI(ms.date);
        if(mi<si||mi>=si+rm)return;
        const mt=MT[ms.mtype]||MT.other;
        const diaColor=ms.markerColor||ms.color||mt.bg;
        const diaBd   =ms.markerColor||ms.color||mt.bd;
        const lblBg   =ms.color||mt.bg;
        const lblBd   =ms.color||mt.bd;
        const lblTx   =ms.fontColor||mt.tx;

        /* bx: if snapped to a segment, track that segment's position; else use ms.date */
        let bx=dX(ms.date,si,mxs,months,gw);
        if(ms.snapPhase){
          const snappedPh=proj.phases.find(ph=>ph.id===ms.snapPhase.phaseId);
          if(snappedPh){
            /* prefer snapping to the specific segment if stored */
            const snappedSeg=ms.snapPhase.segId
              ?snappedPh.segs?.find(s=>s.id===ms.snapPhase.segId)
              :null;
            const anchor=snappedSeg||snappedPh;
            const px1=dX(anchor.start,si,mxs,months,gw);
            const px2=dX(anchor.end,si,mxs,months,gw);
            bx=px1+ms.snapPhase.frac*(px2-px1);
          }
        }
        const dx2=ms.dx||0;
        const diaX=Math.max(info.projX1,Math.min(info.projX2,bx+dx2));

        /* diamond y: if no msrow (collapsed / no phases), default to project row centre */
        const projGroupH=info.projGroupH||RH;
        const msRelY=(info.msRowY!=null)?(info.msRowY-info.projRowY):(RH/2-DS/2);
        const defaultDy=(info.msRowY!=null)?(msRelY+info.msRowH/2):(RH/2);
        const rawDy=(ms.dy!=null)?ms.dy:defaultDy;
        /* full group: diamond can live anywhere from top of project row to bottom of last row */
        const minY=DS/2;
        const maxY=projGroupH-DS/2;
        const dy2=Math.max(minY,Math.min(maxY,rawDy));
        const diaY=info.projRowY+dy2;

        /* label: ms.ldx/ms.ldy are RELATIVE offsets from diamond center.
           null = use default position (right of and centred on diamond).
           Storing as relative means label moves with diamond on column resize. */
        const DEF_LDX=DS/2+6;   /* 14px right of diamond center */
        const DEF_LDY=-9;        /* vertically centred on diamond (~18px label height) */
        const hasLblPos=(ms.ldx!=null&&ms.ldy!=null);
        const ldxRel=hasLblPos?ms.ldx:DEF_LDX;
        const ldyRel=hasLblPos?ms.ldy:DEF_LDY;
        /* absolute label position = diamond position + relative offset, clamped to project group */
        const lblX=diaX+ldxRel;
        const lblY=Math.max(info.projRowY, Math.min(info.projRowY+projGroupH-32, diaY+ldyRel));
        const lblW=ms.lw&&ms.lw>0?ms.lw:120;
        const lblCX=lblX+lblW/2, lblCY=lblY+9;

        /* clamp bounds for drag */
        const minLdxRel=info.projX1-diaX-10;
        const maxLdxRel=info.projX2-diaX+10;
        const minLdyRel=info.projRowY-diaY;
        const maxLdyRel=info.projRowY+projGroupH-32-diaY;

        const isM=sel?.k==='ms'&&sel.id===ms.id;
        const _pid=proj.id, _id=ms.id;
        const clw=Math.max(0.5,Math.min(6,ms.clw||1.5));
        const clColor=ms.clc||diaBd;
        const clDash=ms.cltype==='dotted'?'2 3':ms.cltype==='solid'?'none':'8 4';
        const isNoneShape=ms.mshape==='none';

        /* connector line: always for none shape, otherwise only when label is displaced */
        const displaced=hasLblPos&&(Math.abs(ldxRel-DEF_LDX)>6||Math.abs(ldyRel-DEF_LDY)>6);
        if(isNoneShape||displaced){
          els.push(h('svg',{key:'con-'+_id,
            style:{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none',overflow:'visible',zIndex:11}},
            h('line',{x1:diaX,y1:diaY,x2:lblCX,y2:lblCY,
              stroke:clColor,strokeWidth:clw,strokeDasharray:clDash,opacity:.8})));
        }

          /* milestone shape */
          const msShape=MS_SHAPES[ms.mshape]||MS_SHAPES.diamond;
          els.push(h('div',{key:'dia-'+_id,
            className:'msdia'+(isM?' sel':''),
            style:{position:'absolute',left:diaX-DS/2,top:diaY-DS/2,width:DS,height:DS,
              zIndex:12,pointerEvents:'all',cursor:'grab',userSelect:'none',
              display:'flex',alignItems:'center',justifyContent:'center',
              boxShadow:isM?'0 0 0 2px #fff,0 0 0 4px #2563eb':'none',
              borderRadius:'50%'},
            title:ms.label+' ('+mt.lbl+') — '+fmtDate(ms.date)+'\nDrag · dbl-click to reset',
            onClick:e=>{e.stopPropagation();if(dragMoved.current)return;setSel({k:'ms',pid:_pid,id:_id});setAdding(null);},
            onDoubleClick:e=>{e.stopPropagation();upd(d=>{const o=d.projects.find(p=>p.id===_pid)?.milestones.find(m=>m.id===_id);if(o){o.dx=0;o.dy=null;o.ldx=null;o.ldy=null;o.lw=0;o.snapPhase=null;}});},
            onMouseDown:e=>{e.preventDefault();e.stopPropagation();
              mdRef.current={pid:_pid,id:_id,part:'d',sx:e.clientX,sy:e.clientY,
                startAbsX:diaX,baseBx:bx,minAbsX:info.projX1,maxAbsX:info.projX2,
                ody:dy2,minY,maxY,pgH:projGroupH};
              document.body.style.cursor='grabbing';document.body.style.userSelect='none';},
            },
            msShape.render(DS,diaColor,diaBd)));

          /* label */
          els.push(h('div',{key:'lbl-'+_id,
            className:'mslbl'+(isM?' sel':''),
            style:{position:'absolute',left:lblX,top:lblY,width:lblW,
              background:lblBg,color:lblTx,border:'1.5px solid '+lblBd,
              boxShadow:'0 1px 4px rgba(0,0,0,.2)',pointerEvents:'all',cursor:'grab'},
            title:'Drag label · right edge to resize · dbl-click resets',
            onClick:e=>{e.stopPropagation();if(dragMoved.current)return;setSel({k:'ms',pid:_pid,id:_id});setAdding(null);},
            onDoubleClick:e=>{e.stopPropagation();upd(d=>{const o=d.projects.find(p=>p.id===_pid)?.milestones.find(m=>m.id===_id);if(o){o.ldx=null;o.ldy=null;o.lw=0;}});},
            onMouseDown:e=>{
              if(e.target.closest&&e.target.closest('.mslbl-rh'))return;
              e.preventDefault();e.stopPropagation();
              mdRef.current={pid:_pid,id:_id,part:'l',sx:e.clientX,sy:e.clientY,
                startLdxRel:ldxRel,startLdyRel:ldyRel,minLdxRel,maxLdxRel,minLdyRel,maxLdyRel};
              document.body.style.cursor='grabbing';document.body.style.userSelect='none';},
            },
            h('span',{style:{fontWeight:ms.bold?700:'inherit',fontStyle:ms.italic?'italic':'inherit',textDecoration:ms.underline?'underline':'inherit',color:lblTx}},mt.icon+' '+ms.label),
            h('span',{className:'msdt'},fmtDate(ms.date)),
            h('div',{className:'mslbl-rh',
              onClick:e=>e.stopPropagation(),
              onMouseDown:e=>{e.preventDefault();e.stopPropagation();
                const sw=lblW,sx=e.clientX,pid2=_pid,id2=_id;
                const mm=ev=>{dragMoved.current=true;const nw=Math.max(60,sw+(ev.clientX-sx));upd(d=>{const o=d.projects.find(p=>p.id===pid2)?.milestones.find(m=>m.id===id2);if(o)o.lw=Math.round(nw);});};
                const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';document.body.style.userSelect='';setTimeout(()=>{dragMoved.current=false;},0);};
                window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
                document.body.style.cursor='ew-resize';document.body.style.userSelect='none';}})));
      });
    });
    return els;
  }

  /* ── milestone type legend ── */
  const usedTypes=[...new Set(projects.flatMap(p=>p.milestones.map(m=>m.mtype)))].filter(Boolean);

  /* ── render ── */
  return h('div',{className:theme==='light'?'light-theme':'',style:{display:'flex',flexDirection:'column',height:'100vh'}},

    h('div',{className:'tb'},
      /* hamburger */
      h('button',{className:'hbg'+(menuOpen?' open':''),onClick:()=>setMenuOpen(o=>!o),title:'Menu'},
        h('span'),h('span'),h('span')),
      /* undo / redo */
      h('button',{className:'tb-btn',disabled:!canUndo,title:'Undo (Ctrl+Z)',
        style:{opacity:canUndo?1:.35,fontSize:16,padding:'5px 10px'},
        onClick:undo},'↩'),
      h('button',{className:'tb-btn',disabled:!canRedo,title:'Redo (Ctrl+Y)',
        style:{opacity:canRedo?1:.35,fontSize:16,padding:'5px 10px'},
        onClick:redo},'↪'),
      h('span',{className:'tb-logo'},'Lane',h('span',null,'Way')),
      h('div',{className:'tb-sep'}),
      h('button',{className:'tb-btn',onClick:()=>{setAdding('proj');setAddPid(null);}},'+ Project'),
      h('button',{className:'tb-btn',onClick:()=>{setAdding('ph');setAddPid(selPid||(projects[0]?.id)||null);}},'+ Phase'),
      h('button',{className:'tb-btn',onClick:()=>{setAdding('ms');setAddPid(selPid||(projects[0]?.id)||null);}},'\u25c6 Milestone'),
      h('div',{className:'tb-sep'}),
      h('span',{className:'tb-lbl'},'From'),
      h('input',{className:'tb-in',type:'month',style:{width:150},value:rs,onChange:e=>upd(d=>{d.rs=e.target.value})}),
      h('span',{className:'tb-lbl'},'Mo'),
      h('input',{className:'tb-in',type:'number',style:{width:44},value:rm,min:2,max:48,onChange:e=>upd(d=>{d.rm=Math.max(2,Math.min(48,+e.target.value||12))})}),
      h('div',{className:'tb-sep'}),
      h('span',{className:'tb-lbl'},'Zoom'),
      h('button',{className:'zp-btn',style:{fontSize:16,fontWeight:700,padding:'4px 10px',borderRadius:'6px 0 0 6px'},
        onClick:()=>upd(d=>{d.mw=Math.max(40,d.mw-20);})},'−'),
      h('span',{style:{
        background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',
        borderLeft:'none',borderRight:'none',
        color:'#e2e8f0',fontSize:12,fontWeight:600,fontFamily:'var(--fn)',
        padding:'0 8px',display:'flex',alignItems:'center',minWidth:44,
        justifyContent:'center',flexShrink:0,height:30,
      }},Math.round((DMW-40)/(430-40)*100)+'%'),
      h('button',{className:'zp-btn',style:{fontSize:16,fontWeight:700,padding:'4px 10px',borderRadius:'0 6px 6px 0'},
        onClick:()=>upd(d=>{d.mw=Math.min(430,d.mw+20);})},'＋'),
      h('div',{className:'zp'},
        [{l:'M',v:80},{l:'W',v:140},{l:'D',v:240}].map(({l,v})=>
          h('button',{key:l,className:'zp-btn'+(DMW===v?' on':''),onClick:()=>upd(d=>{d.mw=v})},l))),
      h('div',{className:'tb-sep'}),
      h('span',{className:'tb-lbl'},'Days'),
      h('div',{className:'zp'},
        [{l:'All',v:false},{l:'Biz',v:true}].map(({l,v})=>
          h('button',{key:l,className:'zp-btn'+(bizDays===v?' on':''),
            onClick:()=>upd(d=>{d.bizDays=v})},l))),
      h('button',{className:'zp-btn'+(showDays?' on':''),
        title:showDays?'Hide Days column':'Show Days column',
        style:{marginLeft:4},
        onClick:()=>upd(d=>{d.showDays=!d.showDays;})},showDays?'# Hide':'# Show'),
      h('input',{ref:importRef,type:'file',accept:'.json',style:{display:'none'},
        onChange:e=>{handleImport(e.target.files[0]);e.target.value='';}}),
      h('div',{className:'tb-sp'}),
      h('span',{style:{fontSize:12,color:importMsg.startsWith('✓')?'#86efac':importMsg.startsWith('✗')?'#fca5a5':'#475569',display:'flex',alignItems:'center',gap:6,flexShrink:0,marginRight:6,transition:'color .3s'}},
        h('span',{style:{display:'inline-block',width:8,height:8,borderRadius:'50%',background:importMsg.startsWith('✗')?'#ef4444':'#22c55e',flexShrink:0}}),
        importMsg||'Saved to browser'),
      h('button',{className:'tb-btn',title:'Toggle stats bar',
        onClick:()=>setShowStats(s=>!s),
        style:{fontSize:14,background:showStats?'rgba(99,102,241,.18)':'transparent',
          border:'1px solid '+(showStats?'rgba(99,102,241,.5)':'rgba(255,255,255,.12)'),
          color:showStats?'#a5b4fc':'var(--txt3)',borderRadius:6,padding:'0 8px',height:28,cursor:'pointer',flexShrink:0}},
        '≡'),
      h('button',{className:'tb-btn',title:(theme==='dark'?'Switch to light':'Switch to dark')+' theme',
        onClick:()=>setTheme(t=>t==='dark'?'light':'dark'),
        style:{fontSize:15,background:'transparent',border:'1px solid rgba(255,255,255,.12)',
          color:'var(--txt3)',borderRadius:6,padding:'0 8px',height:28,cursor:'pointer',flexShrink:0}},
        theme==='dark'?'☀':'🌙'),
      tdVis&&h('span',{style:{color:'#f87171',fontSize:13,fontWeight:700,flexShrink:0}},'● TODAY '+fmtS(TDF))
    ),

    /* ── hamburger menu panel ── */
    menuOpen&&h('div',{className:'menu-backdrop',onClick:()=>setMenuOpen(false)}),
    menuOpen&&h('div',{className:'menu-panel',onClick:e=>e.stopPropagation()},
      /* canvas */
      h('div',{className:'menu-section'},
        h('div',{className:'menu-lbl'},'Canvas'),
        h('button',{className:'mi',onClick:()=>{setMenuOpen(false);addTab();}},
          h('div',{className:'mi-ico',style:{background:'rgba(99,102,241,.12)',color:'#a5b4fc'}},'＋'),
          h('div',{className:'mi-body'},h('div',null,'New tab'),h('div',{className:'mi-sub'},'Start a fresh plan in a new tab'))),
        h('button',{className:'mi',onClick:()=>{
            setMenuOpen(false);
            const id='tab-'+Date.now();

      const totalBizDays=planStart!=='—'&&planEnd!=='—'?bizDayCt(planStart,planEnd):0;
      return showStats&&h('div',{className:'stats-bar'},
        h('div',{className:'stat-item'},h('span',null,'Projects:'),h('span',{className:'stat-val'},data.projects.length)),
        h('div',{className:'stat-item'},h('span',null,'Phases:'),h('span',{className:'stat-val'},totalPhases)),
        h('div',{className:'stat-item'},h('span',null,'Segments:'),h('span',{className:'stat-val'},totalSegs)),
        h('div',{className:'stat-item'},h('span',null,'Milestones:'),h('span',{className:'stat-val'},totalMs)),
        planStart!=='—'&&h('div',{className:'stat-item'},h('span',null,'Span:'),h('span',{className:'stat-val'},fmtS(planStart),' – ',fmtS(planEnd))),
        totalBizDays>0&&h('div',{className:'stat-item'},h('span',null,'Biz days:'),h('span',{className:'stat-val'},totalBizDays)),
        overallPct>0&&h('div',{className:'stat-item',style:{gap:8}},
          h('span',null,'Overall:'),
          h('div',{style:{width:80,height:4,borderRadius:2,background:'rgba(255,255,255,.1)',overflow:'hidden'}},
            h('div',{style:{width:overallPct+'%',height:'100%',background:overallPct===100?'#4ade80':'#60a5fa',borderRadius:2}})),
          h('span',{className:'stat-val'},overallPct+'%')));
    })(),

    h('div',{className:'gw',ref:containerRef,onClick:()=>projMenu&&setProjMenu(null)},
      h('div',{style:{width:LW+GW,minWidth:'100%',position:'relative'}},

        h('div',{className:'ghdr',style:{height:HH}},
          h('div',{className:'ghl',style:{width:LW,height:HH}},
            h('div',{className:'ghc',style:{width:32,height:HH,justifyContent:'center'}},'#'),
            h('div',{className:'ghc',style:{width:NW,height:HH}},
              'Task Name',
              h('div',{className:'crh',
                title:'Drag to resize · double-click to reset',
                onDoubleClick:e=>{e.preventDefault();setData(d=>({...d,nw:200}));},
                onMouseDown:e=>{e.preventDefault();crRef.current={ow:NW,sx:e.clientX};document.body.style.cursor='col-resize';document.body.style.userSelect='none';}})),
            h('div',{className:'ghc',style:{width:68,height:HH}},'Type'),
            h('div',{className:'ghc',style:{width:SW,height:HH,position:'relative'}},
              'Start',
              h('div',{className:'crh',title:'Drag to resize · double-click to reset',
                onDoubleClick:e=>{e.preventDefault();setData(d=>({...d,sw:90}));},
                onMouseDown:e=>{e.preventDefault();swRef.current={ow:SW,sx:e.clientX};document.body.style.cursor='col-resize';document.body.style.userSelect='none';}})),
            h('div',{className:'ghc',style:{width:FW,height:HH,position:'relative'}},
              'Finish',
              h('div',{className:'crh',title:'Drag to resize · double-click to reset',
                onDoubleClick:e=>{e.preventDefault();setData(d=>({...d,fw:90}));},
                onMouseDown:e=>{e.preventDefault();fwRef.current={ow:FW,sx:e.clientX};document.body.style.cursor='col-resize';document.body.style.userSelect='none';}})),
            showDays&&h('div',{className:'ghc',style:{width:60,height:HH,fontSize:10,color:'var(--txt3)'},title:'Business days (effort)'},'Days')),
          h('div',{className:'ghr',style:{width:GW}},
            /* year band */
            h('div',{className:'tband tbyr',style:{position:'relative'}},
              ygs.map(g=>h('div',{key:g.y,className:'tc',style:{width:g.w,height:hdrH.yr}},g.y)),
              h('div',{className:'band-rh',onMouseDown:e=>{e.preventDefault();
                const sh=hdrH.yr,sy=e.clientY;
                const mm=ev=>setData(d=>({...d,hdrH:{...(d.hdrH||{}),yr:Math.max(16,sh+(ev.clientY-sy))}}));
                const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';};
                window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
                document.body.style.cursor='ns-resize';}})),
            /* month band */
            h('div',{className:'tband tbmo',style:{position:'relative'}},
              months.map(ym=>{
                const mw=gw(ym),isT=ym===TDY;
                return h('div',{key:ym,className:'tc'+(isT?' tm':''),style:{width:mw,height:hdrH.mo,position:'relative'}},
                  fmtM(ym,mw),
                  h('div',{className:'mrh',
                    title:'Drag to resize month · double-click to reset',
                    onDoubleClick:e=>{e.preventDefault();setData(d=>{const m2={...d.mws};delete m2[ym];return{...d,mws:m2};});},
                    onMouseDown:e=>{e.preventDefault();mrRef.current={ym,ow:gw(ym),sx:e.clientX};document.body.style.cursor='col-resize';document.body.style.userSelect='none';}}));
              }),
              h('div',{className:'band-rh',onMouseDown:e=>{e.preventDefault();
                const sh=hdrH.mo,sy=e.clientY;
                const mm=ev=>setData(d=>({...d,hdrH:{...(d.hdrH||{}),mo:Math.max(18,sh+(ev.clientY-sy))}}));
                const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';};
                window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
                document.body.style.cursor='ns-resize';}})),
            /* week band */
            showW&&h('div',{className:'tband tbwk',style:{position:'relative'}},
              months.flatMap(ym=>{
                const d=dimOf(ym),mw=gw(ym),wks=[];
                for(let s=1;s<=d;s+=7)wks.push({s,e:Math.min(s+6,d)});
                return wks.map((w,wi)=>h('div',{key:ym+'w'+wi,className:'tc',style:{width:(w.e-w.s+1)/d*mw,height:hdrH.wk}},mw>=120?'W'+(wi+1):''));
              }),
              h('div',{className:'band-rh',onMouseDown:e=>{e.preventDefault();
                const sh=hdrH.wk,sy=e.clientY;
                const mm=ev=>setData(d=>({...d,hdrH:{...(d.hdrH||{}),wk:Math.max(12,sh+(ev.clientY-sy))}}));
                const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';};
                window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
                document.body.style.cursor='ns-resize';}})),
            /* day band */
            showD&&h('div',{className:'tband tbdy',style:{position:'relative'}},
              months.flatMap(ym=>{
                const d=dimOf(ym),mw=gw(ym);
                const[y,m]=ym.split('-').map(Number);
                const pw=mw/d;
                const cells=[];
                for(let di=1;di<=d;di++){
                  const dw=dow(y,m,di);
                  const isWknd=dw===0||dw===6;
                  const isToday=ym===TDY&&di===+TDF.split('-')[2];
                  /* in bizDays mode skip weekend columns */
                  if(bizDays&&isWknd)continue;
                  const w=bizDays?pw*(7/5):pw;
                  const cls='tc'+(isWknd?' wknd':'')+(isToday?' today-d':'');
                  const label=w>=14?String(di):'';
                  cells.push(h('div',{key:ym+'d'+di,className:cls,style:{width:w,height:hdrH.dy,flexShrink:0}},label));
                }
                return cells;
              }),
              h('div',{className:'band-rh',onMouseDown:e=>{e.preventDefault();
                const sh=hdrH.dy,sy=e.clientY;
                const mm=ev=>setData(d=>({...d,hdrH:{...(d.hdrH||{}),dy:Math.max(12,sh+(ev.clientY-sy))}}));
                const mu=()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu);document.body.style.cursor='';};
                window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu);
                document.body.style.cursor='ns-resize';}}))),
          tdVis&&h('div',{className:'tdlbl',style:{left:LW+tdX,top:2}},'TODAY')),

        /* rows container - sits naturally below sticky ghdr */
        h('div',{style:{position:'relative'}},
          flatRows.map((row,idx)=>renderRow(row,idx)),

          /* milestone overlay — z-index 24, below sticky header (30) but above row content */
          h('div',{key:'msov',style:{position:'absolute',top:0,left:LW,width:GW,height:totalRowsH,pointerEvents:'none',zIndex:24}},
            renderMilestones()),

          tdVis&&h('div',{className:'tdl',style:{left:LW+tdX,top:0,height:totalRowsH+32}})),

        h('div',{className:'foot',style:{height:36}},
          h('div',{style:{width:LW,position:'sticky',left:0,zIndex:10,background:'var(--bg0)',borderRight:'2px solid var(--bdr2)',display:'flex',alignItems:'center',gap:6,padding:'0 10px',overflow:'hidden'}},
            usedTypes.map(k=>{const mt=MT[k];return mt?h('span',{key:k,style:{fontSize:9,fontWeight:700,background:mt.bg,color:mt.tx,border:'1px solid '+mt.bd,borderRadius:8,padding:'1px 5px',whiteSpace:'nowrap'}},mt.icon+' '+mt.lbl):null;})),
          h('div',{className:'foot-hint'},
            rdState?'Release to drop · Esc to cancel':
            sel?.k==='proj'?'"'+sp?.name+'" selected — click + Phase or ◆ Milestone to add':
            '⋮⋮ Drag handle to reorder rows · grab ◁ ▷ edge grips to resize phases · drag bar center to move'))
      )
    ),

    /* ── slide-in drawer ── */
    isDrawerOpen&&h('div',{className:'drawer-backdrop',onClick:closeDrawer}),
    isDrawerOpen&&drawerV&&h('div',{className:'drawer',onClick:e=>e.stopPropagation()},
      h('div',{className:'drawer-hdr'},
        h('span',{className:'drawer-title'},drawerTitle),
        h('button',{className:'drawer-close',onClick:closeDrawer},'×')),
      h('div',{className:'drawer-body'},
        adding==='proj'&&h(ProjFrm,{p:drawerV,onChange:setDrawerV,onDel:null}),
        adding==='ph'&&h(PhFrm,{v:drawerV,onChange:setDrawerV,isNew:true,projects,selPid:ePid,onPidChange:setAddPid}),
        adding==='ms'&&h(MsFrm,{v:drawerV,onChange:setDrawerV,isNew:true,projects,selPid:ePid,onPidChange:setAddPid}),
        sel?.k==='proj'&&drawerV&&h(ProjFrm,{p:drawerV,onChange:setDrawerV,onDel:drawerDelete,tabs,activeTabId,onMoveToTab:(tabId,keepCopy)=>moveProjectToTab(sel.id,tabId,keepCopy)}),
        sel?.k==='ph'&&drawerV&&h(PhFrm,{v:drawerV,onChange:setDrawerV,isNew:false,projects}),
        sel?.k==='ms'&&drawerV&&h(MsFrm,{v:drawerV,onChange:setDrawerV,isNew:false,projects})),
      h('div',{className:'drawer-foot'},
        h('button',{className:'pbtn pbtn-p',disabled:!drawerCanSave,
          style:{flex:1,fontSize:15,padding:'13px 0',borderRadius:10,opacity:drawerCanSave?1:.4,fontWeight:600},
          onClick:drawerSave},drawerIsEdit?'Save changes':'Add'),
        drawerIsEdit&&h('button',{className:'pbtn pbtn-d',style:{fontSize:15,padding:'13px 22px',borderRadius:10,fontWeight:600},
          onClick:drawerDelete},'Delete')))

    /* ── footer ── */
    ,h('footer',{className:'app-footer'},
      h('span',{style:{fontWeight:700,color:'var(--txt2)',letterSpacing:'.02em'}},'LaneWay'),
      h('span',{className:'footer-sep'},'|'),
      h('a',{href:'#',onClick:e=>{e.preventDefault();setShowGuide(true);}},'User Guide'),
      h('span',{className:'footer-sep'},'|'),
      h('a',{href:'#',onClick:e=>{e.preventDefault();setMenuOpen(true);}},'Export / Import'),
      h('span',{className:'footer-sep'},'|'),
      h('a',{href:'https://github.com',target:'_blank',rel:'noopener'},'GitHub'),
      h('span',{className:'footer-sep'},'|'),
      h('a',{href:'mailto:feedback@laneway.app'},'Send Feedback'),
      h('div',{style:{flex:1}}),
      h('span',null,'v8.5'),
      h('span',{className:'footer-sep'},'·'),
      h('span',null,data.projects.length+' project'+(data.projects.length!==1?'s':'')),
      h('span',{className:'footer-sep'},'·'),
      h('span',null,tabs.length+' tab'+(tabs.length!==1?'s':'')),
      h('span',{className:'footer-sep'},'·'),
      h('span',null,'Auto-saved locally'))
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));



</script>
</body>
</html>
